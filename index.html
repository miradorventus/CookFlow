/* ---------- Durées ---------- */
function parseDuration(str) {
  if (typeof str === 'number') return Math.round(str * 60);
  const s = norm(str);
  if (!s) return 0;
  let total = 0, found = false;
  const h = s.match(/(\d+(?:[.,]\d+)?)\s*h(?![a-z])/); if (h) { total += parseFloat(h[1].replace(',', '.')) * 3600; found = true; }
  const hm = s.match(/(\d+)\s*h\s*(\d{1,2})(?!\s*(?:s|sec))/); if (hm) { total = (+hm[1]) * 3600 + (+hm[2]) * 60; return total; }
  const m = s.match(/(\d+(?:[.,]\d+)?)\s*(?:min|mn|m(?![a-z]))/); if (m) { total += parseFloat(m[1].replace(',', '.')) * 60; found = true; }
  const sec = s.match(/(\d+)\s*(?:sec|s(?![a-z]))/); if (sec) { total += +sec[1]; found = true; }
  if (!found) { const n = parseFloat(s.replace(',', '.')); if (!isNaN(n)) total = n * 60; }
  return Math.round(total);
}
function fmtClock(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0');
}
function fmtMinutes(min) {
  min = Math.round(min || 0);
  if (min < 60) return min + ' min';
  const h = Math.floor(min / 60), m = min % 60;
  return h + ' h' + (m ? ' ' + String(m).padStart(2, '0') : '');
}

/* ---------- Quantités ---------- */
const FRACTIONS = { 0.25: '¼', 0.5: '½', 0.75: '¾', 0.33: '⅓', 0.67: '⅔' };
function fmtNumber(q) {
  if (q == null || isNaN(q)) return '';
  const int = Math.floor(q), frac = Math.round((q - int) * 100) / 100;
  if (frac && FRACTIONS[frac]) return (int ? int + ' ' : '') + FRACTIONS[frac];
  return String(Math.round(q * 10) / 10).replace('.', ',');
}
function scaleQty(qty, unit, scale) {
  if (!qty) return 0;
  let v = qty * scale;
  const u = norm(unit);
  if (['g', 'ml', 'gr'].includes(u)) v = v >= 100 ? Math.round(v / 5) * 5 : Math.round(v);
  else if (['kg', 'l', 'cl', 'dl'].includes(u)) v = Math.round(v * 10) / 10;
  else v = Math.round(v * 4) / 4;
  return v;
}
function fmtQty(qty, unit) {
  if (!qty) return unit ? esc(unit) : '';
  return fmtNumber(qty) + (unit ? ' ' + unit : '');
}
// Met à l’échelle les quantités écrites dans un texte (« Ajoutez 250 g de lait »)
function scaleText(text, scale) {
  if (!text || Math.abs(scale - 1) < 0.01) return text || '';
  return text.replace(/(\d+(?:[.,]\d+)?)\s?(g|kg|ml|cl|l)\b/g, (all, n, u) => {
    const v = scaleQty(parseFloat(n.replace(',', '.')), u, scale);
    return fmtNumber(v) + ' ' + u;
  });
}

function toJpegBlob(src, max = 900, q = 0.8) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(b) : reject(new Error('Image illisible')), 'image/jpeg', q);
    };
    img.onerror = () => reject(new Error('Image illisible'));
    img.src = src;
  });
}

async function generateImageBlob(r, signal) {
  const c = imgConf(), prompt = imgPrompt(r);
  const post = async (url, body, headers = {}) => {
    const res = await fetch(url, { method: 'POST', signal, headers: { 'Content-Type': 'application/json', ...headers }, body: JSON.stringify(body) });
    const txt = await res.text();
    let d; try { d = JSON.parse(txt); } catch (e) { d = null; }
    if (!res.ok) throw new Error(`Erreur ${res.status} : ` + String(d?.error?.message || d?.error || d?.detail || txt).slice(0, 240));
    return d;
  };
  let b64 = '', mime = 'image/png', url = '';
  if (c.provider === 'a1111') {
    const d = await post(c.baseUrl + '/sdapi/v1/txt2img', {
      prompt, negative_prompt: 'text, watermark, logo, letters, hands, people, blurry, deformed, low quality',
      steps: 24, width: 768, height: 576, cfg_scale: 6, sampler_name: 'DPM++ 2M', ...(c.model ? { override_settings: { sd_model_checkpoint: c.model } } : {})
    });
    b64 = d.images?.[0] || '';
  } else if (c.provider === 'openai') {
    const d = await post(c.baseUrl + '/images/generations', { ...(c.model ? { model: c.model } : {}), prompt, n: 1, size: '1024x1024', response_format: 'b64_json' },
      c.apiKey ? { Authorization: 'Bearer ' + c.apiKey } : {});
    b64 = d.data?.[0]?.b64_json || ''; url = d.data?.[0]?.url || '';
  } else if (c.provider === 'gemini') {
    if (!db.settings.ai.apiKey) throw new Error('Ajoutez la clé Google dans Réglages → Assistant IA.');
    const d = await post(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model)}:generateContent`, {
      contents: [{ role: 'user', parts: [{ text: 'Generate a photo: ' + prompt }] }], generationConfig: { responseModalities: ['IMAGE'] }
    }, { 'x-goog-api-key': db.settings.ai.apiKey });
    const part = (d.candidates?.[0]?.content?.parts || []).find(p => p.inlineData || p.inline_data);
    const inl = part?.inlineData || part?.inline_data;
    b64 = inl?.data || ''; mime = inl?.mimeType || inl?.mime_type || mime;
  } else throw new Error('Aucun générateur d’images configuré (Réglages → Images).');
  const src = b64 ? (b64.startsWith('data:') ? b64 : `data:${mime};base64,${b64}`) : url;
  if (!src) throw new Error('Le serveur n’a renvoyé aucune image.');
  return toJpegBlob(src);
}

async function generateMissingImages() {
  if (!imgReady()) return openImgSettings();
  if (batchCtrl) { batchCtrl.abort(); return; }
  const todo = db.recipes.filter(r => !imgSrc(r));
  if (!todo.length) return toast('Toutes les recettes ont déjà une image');
  if (!await confirmDlg('Générer ' + todo.length + ' images ?', 'Votre générateur va créer une photo pour chaque recette sans image. Vous pouvez arrêter à tout moment.', 'Lancer')) return;
  batchCtrl = new AbortController();
  let ok = 0, fail = 0, lastErr = '';
  for (const r of todo) {
    if (batchCtrl.signal.aborted) break;
    batchStatus(`Image ${ok + fail + 1} sur ${todo.length} · ${r.title}`);
    try { await setRecipeImage(r, await generateImageBlob(r, batchCtrl.signal), false); ok++; db.saveRecipes(); }
    catch (e) { if (batchCtrl.signal.aborted) break; fail++; lastErr = aiErrorText(e); if (fail >= 3 && !ok) break; }
  }
  const stopped = batchCtrl.signal.aborted; batchCtrl = null; batchStatus('');
  render();
  if (fail && !ok) alertDlg('Génération impossible', lastErr);

}

  let list = db.recipes.filter(r => {
    if (ui.course && r.course !== ui.course) return false;
    if (db.settings.hideExtraGear && r.gear) return false;
    if (accTest && !accTest(r)) return false;
    switch (ui.filter) {
      case 'fav': if (!r.fav) return false; break;
      case 'classique': if (!r.tags.includes('classique')) return false; break;
      case 'monde': if (!r.tags.includes('monde')) return false; break;
      case 'tm6': case 'ninja': case 'combo': if (r.category !== ui.filter) return false; break;
      case 'mine': if (r.builtin) return false; break;
    }
    if (!q) return true;
    const hay = norm([r.title, r.description, r.tags.join(' '), r.ingredients.map(i => i.name).join(' ')].join(' '));
    return q.split(/\s+/).every(w => hay.includes(w));

function portionsOf(r) { return ui.portions[r.id] || r.basePortions; }
function usesTm6(r) { return r.steps.some(s => s.type === 'tm6_dials' || s.type === 'weigh'); }
function usesNinja(r) { return r.steps.some(s => s.type === 'ninja_dual'); }
function bowlLoad(r, scale) { return Math.max(0, ...r.steps.filter(s => s.type === 'weigh').map(s => s.targetWeight * scale)); }

function capacityNotes(r, scale) {
  const notes = [];
  if (usesTm6(r)) {
    const load = bowlLoad(r, scale);
    if (load > 2200) {
      notes.push(db.settings.tm6Bowls >= 2
        ? `<b>TM6 :</b> environ ${Math.round(load)} g pour 2,2 L max. Répartissez en 2 bols (≈ ${Math.round(load / 2)} g chacun).`
        : `<b>TM6 :</b> environ ${Math.round(load)} g pour 2,2 L max. Prévoyez 2 tournées ou réduisez les portions.`);
    } else if (load > 0) notes.push(`<b>TM6 :</b> un bol suffit (≈ ${Math.round(load)} g sur 2,2 L).`);
  }
  if (usesNinja(r) && db.settings.ninja && scale > 1.25 && r.steps.some(s => s.type === 'ninja_dual' && !s.mega && !s.zone2.active))
    notes.push('<b>Ninja :</b> quantités augmentées, les cuissons en une zone passent en MATCH sur les deux tiroirs.');
  return notes;
}

function stepSummary(s, scale = 1) {
  const dot = c => `<span class="dot bg-${c} mr-1.5 align-middle"></span>`;
  if (s.type === 'weigh') return dot('accent') + `Peser ${Math.round(s.targetWeight * scale)} g · ${esc(s.ingredient)}`;
  if (s.type === 'tm6_dials') return dot('tm6') + esc([s.time, s.temp !== '—' ? s.temp : '', s.speed ? 'vit. ' + s.speed : '', s.sensInverse ? '↺' : ''].filter(Boolean).join(' / ')) + (s.instruction ? ' · ' + esc(scaleText(s.instruction, scale)) : '');
  if (s.type === 'ninja_dual') {
    const z = (zz) => `${zz.mode} ${zz.temp}°C ${zz.timeMin} min`;
    const txt = s.mega ? 'MegaZone · ' + z(s.zone1) : 'Z1 ' + z(s.zone1) + (s.zone2.active ? ' · Z2 ' + z(s.zone2) : '') + (s.isSync ? ' · SYNC' : '') + (s.isMatch ? ' · MATCH' : '');
    return dot('ninja') + esc(txt);
  }
  return esc(scaleText(s.instruction, scale)) + (s.timerMin ? ` · ⏱ ${fmtMinutes(s.timerMin)}` : '');
}

const AISLES = [
  ['Fruits et légumes', /pomme|poire|banane|citron|orange|fraise|cerise|raisin|tomate|courgette|aubergine|poivron|oignon|ail|echalote|carotte|potiron|potimarron|courge|salade|epinard|chou|brocoli|champignon|patate|pomme de terre|grenaille|haricot vert|poireau|celeri|concombre|avocat|herbe|persil|coriandre|basilic|aneth|thym|menthe|gingembre|legume|fruit|lime|citron vert/],
  ['Viandes et poissons', /poulet|boeuf|bœuf|veau|porc|agneau|canard|magret|dinde|jambon|lardon|guanciale|pancetta|saucisse|steak|hache|viande|saumon|thon|cabillaud|poisson|crevette|moule|aile/],
  ['Crèmerie et œufs', /lait|beurre|creme|yaourt|fromage|emmental|gruyere|comte|parmesan|pecorino|mozzarella|feta|mascarpone|oeuf|œuf|jaune|blanc d/],
  ['Boulangerie', /pain|baguette|brioche|biscuit|mie/],
  ['Épicerie', /farine|sucre|riz|pate|spaghetti|lasagne|rigatoni|semoule|lentille|pois chiche|haricot|levure|chocolat|pepite|cacao|maizena|fecule|huile|vinaigre|bouillon|cube|coulis|concentre|conserve|lait de coco|tahini|chapelure|panko|cafe|miel|confiture|olive|sauce|vin/],
  ['Épices et condiments', /\bsel\b|poivre\b|poudre|vanille|epice|cumin|paprika|curry|muscade|cannelle|piment|garam|origan|herbes de provence|laurier|bouquet garni|girofle|cajun|moutarde/],
  ['Surgelés', /surgele|congele|glace|fish stick|batonnet/]
];
const AISLE_MATCH_ORDER = ['Surgelés', 'Épices et condiments', 'Épicerie', 'Viandes et poissons', 'Crèmerie et œufs', 'Boulangerie', 'Fruits et légumes'];
function guessAisle(name) {
  const n = norm(name);
  for (const a of AISLE_MATCH_ORDER) if (AISLES.find(x => x[0] === a)[1].test(n)) return a;
  return 'Autres';
}
const UNIT_BASE = { kg: ['g', 1000], g: ['g', 1], gr: ['g', 1], l: ['ml', 1000], cl: ['ml', 10], dl: ['ml', 100], ml: ['ml', 1] };
function addToShop(name, qty, unit, from) {
  name = name.trim(); if (!name) return;
  let u = norm(unit).replace(/\.$/, ''), q = qty || 0;
  if (UNIT_BASE[u]) { q *= UNIT_BASE[u][1]; u = UNIT_BASE[u][0]; } else u = unit.trim();
  const key = norm(name).replace(/s\b/g, '') + '|' + norm(u).replace(/s$/, '');
  const ex = db.shop.find(i => !i.done && i.key === key);
  if (ex) { ex.qty = (ex.qty || 0) + q; if (from && !ex.from.includes(from)) ex.from.push(from); }
  else db.shop.push({ id: uid('it'), key, name, qty: q, unit: u, aisle: guessAisle(name), done: false, from: from ? [from] : [] });
}
function shopQty(i) {
  if (!i.qty) return i.unit && !['g', 'ml'].includes(i.unit) ? esc(i.unit) : '';
  if (i.unit === 'g' && i.qty >= 1000) return fmtNumber(Math.round(i.qty / 100) / 10) + ' kg';
  if (i.unit === 'ml' && i.qty >= 1000) return fmtNumber(Math.round(i.qty / 100) / 10) + ' l';
  return fmtQty(Math.round(i.qty * 100) / 100, esc(i.unit));
}
function addRecipeToShop(id, portions, silent) {
  const r = db.recipe(id);
  const scale = (portions || portionsOf(r)) / r.basePortions;
  r.ingredients.forEach(ing => addToShop(ing.name, scaleQty(ing.qty, ing.unit, scale), ing.unit, r.title));
  db.saveShop();
  if (!silent) toast(r.ingredients.length + ' ingrédients ajoutés aux courses');
}

function storageUsage() {
  let n = 0;
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); n += (k.length + (localStorage.getItem(k) || '').length) * 2; } } catch (e) {}
  return n > 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' Mo' : Math.round(n / 1e3) + ' Ko';
}
function notifLabel() {
  if (!('Notification' in window)) return 'Indisponibles';
  return { granted: 'Activées', denied: 'Bloquées', default: 'Activer' }[Notification.permission];
}
async function askNotifications() {
  if (!('Notification' in window)) return alertDlg('Notifications indisponibles', 'Ce navigateur ne les gère pas. Sur iPhone, installez d’abord CookFlow sur l’écran d’accueil.');
  if (Notification.permission === 'denied') return alertDlg('Notifications bloquées', 'Autorisez-les dans les réglages du navigateur pour ce site.');
  await Notification.requestPermission(); render();
}
async function doInstall() { if (!installPrompt) return; installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; render(); }

async function exportBackup() {
  const images = {};
  try { const all = await idb.all(); for (const [id, b] of Object.entries(all)) images[id] = await blobToDataUrl(b); } catch (e) {}
  const data = { app: 'CookFlow', type: 'backup', version: 1, exportedAt: new Date().toISOString(), recipes: db.recipes, plan: db.plan, shop: db.shop, images, settings: { ...db.settings, ai: { ...db.settings.ai, apiKey: '' }, img: { ...db.settings.img, apiKey: '' } } };
  downloadFile('cookflow-sauvegarde-' + isoDate(new Date()) + '.json', JSON.stringify(data));
  toast('Sauvegarde téléchargée');
}
async function importBackup() {
  const f = await pickFile('.json,application/json');
  if (!f) return;
  try {
    const data = JSON.parse(await readText(f));
    if (data.type === 'recipe' || (data.title && data.steps)) return importRecipeObjects([data.recipe || data]);
    if (!Array.isArray(data.recipes)) throw new Error();
    const choice = await dialog('Restaurer la sauvegarde ?', `${data.recipes.length} recettes. Fusionner avec vos données ou tout remplacer ?`,
      [{ label: 'Fusionner', value: 'merge', bold: true }, { label: 'Tout remplacer', value: 'replace', style: 'danger' }, { label: 'Annuler', value: null }]);
    if (!choice) return;
    const incoming = data.recipes.map(normalizeRecipe);
    if (choice === 'replace') { db.recipes = incoming; db.plan = data.plan || {}; db.shop = data.shop || []; }
    else {
      incoming.forEach(r => { const i = db.recipes.findIndex(x => x.id === r.id); if (i >= 0) db.recipes[i] = r; else db.recipes.push(r); });
      Object.assign(db.plan, data.plan || {});
      (data.shop || []).forEach(i => db.shop.push(i));
    }
    if (data.settings) { const ai = db.settings.ai, img = db.settings.img; db.settings = Object.assign({}, db.settings, data.settings, { ai: data.settings.ai?.apiKey ? data.settings.ai : ai, img: Object.assign({}, img, data.settings.img || {}, { apiKey: data.settings.img?.apiKey || img.apiKey }) }); }
    for (const [id, u] of Object.entries(data.images || {})) { const r = db.recipe(id); if (r) try { await setRecipeImage(r, await (await fetch(u)).blob(), false); } catch (e) {} }
    db.saveRecipes(); db.savePlan(); db.saveShop(); db.saveSettings(); applyTheme();
    toast('Sauvegarde restaurée'); render();
  } catch (e) { alertDlg('Fichier non reconnu', 'Choisissez un fichier de sauvegarde CookFlow (.json).'); }
}
function restoreSeeds() { const n = db.addMissingSeeds(true); toast(n ? n + ' recette(s) restaurée(s)' : 'Toutes les recettes intégrées sont déjà là'); render(); }
async function resetAll() {
  if (!await confirmDlg('Tout effacer ?', 'Recettes, planning, courses et réglages seront supprimés de cet appareil.', 'Tout effacer')) return;
  ['recipes', 'plan', 'shop', 'settings', 'seed', 'timers'].forEach(k => store.del(k));
  location.hash = ''; location.reload();
}

/* CookFlow — cuisine guidée et minuteurs */

const G = { active: false, recipe: null, steps: [], i: 0, scale: 1, portions: 4, weighed: {}, done: false, rating: 0, wakeLock: null };

function buildGuidedSteps(r, portions) {
  const scale = portions / r.basePortions;
  const split = usesTm6(r) && bowlLoad(r, scale) > 2200;
  return r.steps.map(src => {
    const s = JSON.parse(JSON.stringify(src));
    s.scale = scale;
    if (s.type === 'weigh') {
      s.scaledWeight = Math.round(s.targetWeight * scale);
      if (split && s.scaledWeight > 1100) s.split = db.settings.tm6Bowls >= 2 ? 'bowls' : 'batches';
    }
    if (s.type === 'ninja_dual' && db.settings.ninja && !s.mega && !s.zone2.active && scale > 1.25) {
      s.zone2 = { ...s.zone1, active: true };
      s.isMatch = true; s.autoMatch = true;
    }
    return s;
  });
}

function startGuided(id) {
  const r = db.recipe(id);
  if (!r.steps.length) { toast('Cette recette n’a pas encore d’étapes'); return; }
  unlockAudio();
  G.recipe = r; G.portions = portionsOf(r); G.scale = G.portions / r.basePortions;
  G.steps = buildGuidedSteps(r, G.portions);
  G.i = 0; G.weighed = {}; G.done = false; G.rating = r.rating || 0; G.active = true;
  const el = $('#guided'); el.classList.remove('hidden'); el.classList.add('flex');
  document.body.style.overflow = 'hidden';
  requestWakeLock();
  renderGuided();
}
function exitGuided() {
  G.active = false;
  if (hands.on) toggleHandsFree();
  const el = $('#guided'); el.classList.add('hidden'); el.classList.remove('flex');
  document.body.style.overflow = '';
  releaseWakeLock();
  render();
}
function stepNav(d) {
  if (G.done) { if (d < 0) { G.done = false; renderGuided(); } else finishGuided(); return; }
  const n = G.i + d;
  if (n < 0) return;
  if (n >= G.steps.length) { G.done = true; renderGuided(); return; }
  G.i = n; renderGuided();
}
function finishGuided() {
  const r = G.recipe;
  r.cooked = (r.cooked || 0) + 1;
  if (G.rating) r.rating = G.rating;
  db.saveRecipes();
  exitGuided();
  toast('Bon appétit !');
}

function renderGuided() {
  const r = G.recipe, n = G.steps.length;
  $('#gTitle').textContent = r.title;
  $('#gCounter').textContent = G.done ? 'Terminé' : `Étape ${G.i + 1} sur ${n} · ${G.portions} pers.`;
  $('#gProgress').style.width = (G.done ? 100 : (G.i / n) * 100) + '%';
  $('#gPrev').disabled = G.i === 0 && !G.done;
  $('#gNext').textContent = G.done ? 'Terminer' : G.i === n - 1 ? 'Terminer la recette' : 'Suivant';
  const box = $('#gStep');
  box.innerHTML = G.done ? doneHtml() : stepHtml(G.steps[G.i], G.i);
  box.scrollTop = 0;
  renderGuidedTimers();
}

  const res = await fetch(c.baseUrl + '/audio/transcriptions', { method: 'POST', body: fd, headers: c.apiKey ? { Authorization: 'Bearer ' + c.apiKey } : {} });
  const d = await res.json().catch(() => null);
  if (!res.ok) throw new Error('Transcription : ' + (d?.error?.message || res.status) + '. Le serveur doit proposer /audio/transcriptions (Whisper).');
  return String(d?.text || '').trim();
}

/* ---------- Recherche parlée ---------- */
const STOP = new Set(('je j tu il on nous vous me m te t moi un une des de du d le la les l au aux a à et ou en pour avec sans sur dans par ce cet cette ces se s qui que qu quoi quel quelle quelles quels '
  + 'veux voudrais voudrait aimerais aimerait faire fais fait peux peut pourrais pourrait donne donner trouve trouver cherche chercher montre montrer propose proposer suggere suggerer as est es sont '
  + 'recette recettes plat plats idee idees envie quelque chose truc trucs bon bonne bons bonnes petit petite ce soir midi demain aujourd hui manger cuisiner preparer ai avoir mon ma mes ton ta tes '
  + 'stp svp please merci bien tout tous toute toutes faut il y ya oui non alors euh hein').split(' '));
const VOICE_COURSE = [[/dessert|sucre|gateau/, 'dessert'], [/entree/, 'entree'], [/soupe|veloute|potage/, 'soupe'], [/apero|aperitif/, 'aperitif'],
  [/petit dej|petit-dej|brunch/, 'petitdej'], [/boisson|smoothie/, 'boisson'], [/accompagnement/, 'accomp'], [/pain|viennoiserie/, 'boulangerie'], [/sauce/, 'sauce']];
function parseVoiceQuery(text) {
  const t = norm(text);
  const q = { text, words: [], course: '', cat: '', quick: false, create: /\b(cree|creer|invente|inventer|genere|generer|nouvelle recette)\b/.test(t) };
  if (/\bninja\b|air ?fryer|friteuse/.test(t)) q.cat = 'ninja';
  else if (/thermomix|\btm6\b|robot/.test(t)) q.cat = 'tm6';
  q.quick = /rapide|vite|express|pas le temps|presse/.test(t);
  for (const [re, c] of VOICE_COURSE) if (re.test(t)) { q.course = c; break; }
  q.words = t.replace(/[^a-z0-9 ]/g, ' ').split(/\s+/)
    .filter(w => w.length > 1 && !STOP.has(w) && !/^(ninja|thermomix|tm6|air|fryer|robot|rapide|vite|express|dessert|desserts|entree|entrees|soupe|soupes|apero|aperitif|cree|creer|invente|genere|generer|nouvelle|minutes?|personnes?)$/.test(w))
    .map(w => w.length > 3 ? w.replace(/(s|x)$/, '') : w);
  return q;
}
function voiceSearch(q) {
  const scored = db.recipes.map(r => {
    if (q.course && r.course !== q.course) return null;
    if (q.cat && !(r.category === q.cat || r.category === 'combo')) return null;
    if (db.settings.hideExtraGear && r.gear) return null;
    const title = norm(r.title), ing = norm(r.ingredients.map(i => i.name).join(' ')), other = norm(r.description + ' ' + r.tags.join(' '));
    let s = 0, hits = 0;
    for (const w of q.words) {
      const h = title.includes(w) ? 4 : ing.includes(w) ? 2 : other.includes(w) ? 1 : 0;
      s += h; if (h) hits++;
    }
    if (q.words.length && !hits) return null;
    s += hits === q.words.length ? 3 : 0;
    const total = r.prepMin + r.cookMin;
    if (q.quick) { if (total > 40) return null; s += (40 - total) / 20; }
    s += r.fav ? 0.5 : 0;
    return { r, s };
  }).filter(Boolean).sort((a, b) => b.s - a.s);
  return scored.slice(0, 8).map(x => x.r);
}
async function aiPickRecipes(text) {
  const catalog = db.recipes.map(r => `${r.id} | ${r.title} | ${COURSES[r.course]?.[0] || ''} | ${CATEGORIES[r.category].short} | ${r.prepMin + r.cookMin} min`).join('\n');
  const out = await callAI('Tu aides à choisir des recettes dans un catalogue. Réponds uniquement en JSON : {"ids": ["id1", ...], "message": "phrase courte en français"}. Au plus 6 ids, uniquement des ids du catalogue, du plus pertinent au moins pertinent. Si rien ne convient, ids vide et message qui le dit.',
    `Catalogue (id | titre | catégorie | appareil | durée) :\n${catalog}\n\nDemande : « ${text} »`);
  const d = extractJson(out);
  return { list: (d.ids || []).map(id => db.recipe(String(id))).filter(Boolean), message: String(d.message || '') };
}

/* ---------- Feuille « Demander » ---------- */
function openVoice() {
  if (!voiceAvailable()) {
    return alertDlg('Dictée indisponible', SR ? '' : 'Ce navigateur n’a pas de reconnaissance vocale intégrée (c’est le cas de Firefox). Utilisez Chrome, Edge ou Safari, ou configurez Google Gemini / un serveur Whisper local dans Réglages → Assistant IA.');
  }
  openSheet({ title: 'Demander', cancel: 'Fermer', onClose: () => stopListening(true) });
  voiceListen();
}
function voiceListenHtml(partial) {
  return `<div class="flex flex-col items-center text-center pt-6 pb-2">
    <button class="mic-orb listening" onclick="stopListening()" aria-label="Terminé"><span class="w-9 h-9">${MIC_SVG}</span></button>
    <p id="voicePartial" class="text-[22px] leading-[28px] font-semibold mt-6 min-h-[56px] max-w-md">${partial ? esc(partial) : '<span class="text-muted font-normal">Je vous écoute…</span>'}</p>
    <p class="text-[14px] text-muted mt-2">Par exemple : « un dessert rapide au Ninja », « qu’est-ce que je fais avec des courgettes et du poulet ? »</p>
    <button class="btn-tinted w-full mt-6" onclick="stopListening()">Terminé</button>
  </div>`;
}
async function voiceListen() {
  $('#sheetBody').innerHTML = voiceListenHtml('');
  try {
    const text = await listenOnce(t => { const el = $('#voicePartial'); if (el) el.textContent = t; });
    if (!sheetOpen()) return;
    if (!text) { $('#sheetBody').innerHTML = voiceRetryHtml('Je n’ai rien entendu.'); return; }
    await voiceAnswer(text);
  } catch (e) {
    if (sheetOpen()) $('#sheetBody').innerHTML = voiceRetryHtml(e.message || String(e));
  }
}
function voiceRetryHtml(msg) {
  return `<div class="text-center pt-8 pb-2"><p class="text-[17px]">${esc(msg)}</p>
    <button class="btn-primary w-full mt-6" onclick="voiceListen()"><span class="w-5 h-5">${MIC_SVG}</span> Réessayer</button></div>`;
}
function voiceRows(list) {
  return `<div class="group mt-2">${list.map(r => `<button class="row-btn" onclick="closeSheet();go('#/recette/${r.id}')">
    ${thumbHtml(r, 'small')}<div class="flex-1 min-w-0 text-left"><div class="truncate font-medium">${esc(r.title)}</div><div class="text-[13px] text-muted">${esc(metaLine(r))}</div></div>${ICONS.chev}</button>`).join('')}</div>`;
}
async function voiceAnswer(text) {
  const q = parseVoiceQuery(text), ai = aiReady();
  const said = `<p class="text-[15px] text-muted mt-2">Vous avez dit</p><p class="text-[20px] leading-[26px] font-semibold mt-0.5">« ${esc(text)} »</p>`;
  const again = `<button class="btn-secondary w-full mt-3" onclick="voiceListen()"><span class="w-5 h-5">${MIC_SVG}</span> Demander autre chose</button>`;
  const createBtn = ai ? `<button class="btn-tinted w-full mt-3" onclick="voiceCreate(this, ${esc(JSON.stringify(text))})"><span class="w-5 h-5">${ICONS.sparkle}</span> Créer une nouvelle recette avec l’IA</button>` : '';
  if (q.create && ai) { $('#sheetBody').innerHTML = said + `<div id="vBusy"></div>`; return voiceCreate($('#vBusy'), text); }
  let list = voiceSearch(q), note = '';
  if (ai && (list.length < 2 || q.words.length > 3)) {
    $('#sheetBody').innerHTML = said + `<p class="text-[15px] text-muted mt-6 flex items-center gap-2"><span class="inline-block w-4 h-4 border-2 border-current border-r-transparent rounded-full animate-spin"></span> Je cherche dans vos recettes…</p>`;
    try { const pick = await aiPickRecipes(text); if (pick.list.length || !list.length) { list = pick.list; note = pick.message; } }
    catch (e) { note = ''; }
    if (!sheetOpen()) return;
  }
  $('#sheetBody').innerHTML = said + (note ? `<p class="text-[15px] mt-4">${esc(note)}</p>` : '')
    + (list.length ? `<div class="section-label !px-0">${list.length} idée${list.length > 1 ? 's' : ''}</div>${voiceRows(list)}`
      : `<p class="text-[16px] mt-5">Aucune recette ne correspond${ai ? '' : '. Essayez avec un ingrédient ou un type de plat'}.</p>`)
    + createBtn + again;
  speak(list.length ? (note || `J’ai trouvé ${list.length} idée${list.length > 1 ? 's' : ''}. La première : ${list[0].title}.`) : 'Je n’ai rien trouvé.');
}
async function voiceCreate(btn, text) {
  await withBusy(btn, 'Création…', async () => {
    const r = await aiRecipe(`Crée une recette pour 4 personnes à partir de cette demande orale : « ${text} ». Utilise le Thermomix TM6 et/ou le Ninja FlexDrawer selon ce qui convient, sans four ni plaque.`);
    r.tags = [...new Set([...r.tags, 'ia'])];
    closeSheet(); newRecipe(r); toast('Recette générée : relisez puis enregistrez', 3500);
  });
}

/* ---------- Synthèse vocale ---------- */
function speak(text) {
  if (!db.settings.voiceReply || !('speechSynthesis' in window) || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'fr-FR'; u.rate = 1.02;
    const v = speechSynthesis.getVoices().find(v => /^fr/i.test(v.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- Mains libres en cuisine guidée ---------- */
const hands = { on: false, rec: null };
function stepSpeech(s) {
  if (!s) return '';
  if (s.type === 'weigh') return `Tarez, puis pesez ${s.scaledWeight} grammes : ${s.ingredient}.`;
  if (s.type === 'tm6_dials') return `${s.title}. ${scaleText(s.instruction || '', s.scale)} Thermomix : ${s.time || ''}${s.temp && s.temp !== '—' ? ', ' + s.temp : ''}${s.speed ? ', vitesse ' + s.speed : ''}${s.sensInverse ? ', sens inverse' : ''}.`;
  if (s.type === 'ninja_dual') {
    const z = (zz, n) => `${n} ${NINJA_MODES[zz.mode] || zz.mode}, ${zz.temp} degrés, ${zz.timeMin} minutes`;
    return `${s.title}. ${s.instruction || ''} Ninja : ${s.mega ? z(s.zone1, 'MegaZone') : z(s.zone1, 'zone 1') + (s.zone2.active ? '. ' + z(s.zone2, 'zone 2') : '')}${s.isSync ? ', en SYNC' : s.isMatch ? ', en MATCH' : ''}.`;
  }
  return `${s.title}. ${scaleText(s.instruction || '', s.scale)}`;
}
function toggleHandsFree() {
  if (!SR) return alertDlg('Mains libres indisponible', 'Il faut la reconnaissance vocale intégrée du navigateur (Chrome, Edge ou Safari).');
  hands.on = !hands.on;
  if (hands.on) { const was = db.settings.voiceReply; db.settings.voiceReply = true; speak('Mains libres activé. Dites suivant, précédent, répète, ou lance le minuteur.'); db.settings.voiceReply = was; handsListen(); }
  else { try { hands.rec?.stop(); } catch (e) {} hands.rec = null; window.speechSynthesis?.cancel(); }
  updateHandsBtn();
}
function updateHandsBtn() {
  const b = $('#gMic'); if (!b) return;
  b.classList.toggle('!bg-accent', hands.on); b.classList.toggle('!text-white', hands.on); b.classList.toggle('listening', hands.on);
  b.setAttribute('aria-pressed', hands.on);
}
function handsListen() {
  if (!hands.on || !G.active) { hands.on = false; updateHandsBtn(); return; }
  const r = new SR(); hands.rec = r;
  r.lang = 'fr-FR'; r.continuous = true; r.interimResults = false;
  r.onresult = e => { const t = norm(e.results[e.results.length - 1][0].transcript); handsCommand(t); };
  r.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'network') { hands.on = false; updateHandsBtn(); toast(srError(e.error), 4000); } };
  r.onend = () => { if (hands.on && G.active) setTimeout(handsListen, 250); };
  try { r.start(); } catch (e) {}
}
function handsCommand(t) {
  const say = txt => { const was = db.settings.voiceReply; db.settings.voiceReply = true; speak(txt); db.settings.voiceReply = was; };
  if (/\b(suivant|suivante|apres|next|c est fait|c est bon|termine|fini)\b/.test(t)) { stepNav(1); setTimeout(() => say(G.done ? 'Recette terminée. Bon appétit !' : stepSpeech(G.steps[G.i])), 150); }
  else if (/\b(precedent|precedente|retour|avant)\b/.test(t)) { stepNav(-1); setTimeout(() => say(stepSpeech(G.steps[G.i])), 150); }
  else if (/\b(repete|relis|redis|lis|quoi)\b/.test(t)) say(stepSpeech(G.steps[G.i]));
  else if (/\b(pese|pesee)\b/.test(t) && G.steps[G.i]?.type === 'weigh') { G.weighed[G.i] = true; renderGuided(); say('Noté.'); }
  else if (/minuteur|chrono|lance|demarre|go\b|top/.test(t)) {
    const b = $('#gStep button.btn-primary[onclick^="startTimer"]');
    if (b) { b.click(); say('Minuteur lancé.'); } else say('Pas de minuteur à lancer à cette étape.');
  }
  else if (/\b(stop|arrete|silence|coupe)\b/.test(t)) {
    const ring = timers.list.find(x => x.ringing);
    if (ring) timerTap(ring.id); else window.speechSynthesis?.cancel();
  }
  else if (/ingredient/.test(t)) say(G.recipe.ingredients.map(i => `${fmtQty(scaleQty(i.qty, i.unit, G.scale), i.unit)} ${i.name}`).join(', '));
}

;
/* CookFlow — démarrage */
db.load();
applyTheme();
updateShopBadge();
render();
loadImages();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.addEventListener('storage', e => { if (e.key && e.key.startsWith('cf.')) { db.load(); render(); } });
</script>
